permissions:
  contents: read

name: Deploy Contracts

on:
  workflow_dispatch:   # manual trigger only

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: nightly

      - name: Clean build artifacts
        run: forge clean

      - name: Run tests
        run: forge test --gas-report

      - name: Run coverage
        run: forge coverage --ir-minimum --report lcov

      - name: Run gas snapshot
        run: forge snapshot --snap gas-snapshot.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: lcov.info

      - name: Upload gas snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gas-snapshot
          path: gas-snapshot.txt

      - name: Clean before deploy
        run: forge clean

      - name: Run deployment script (Sepolia)
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          forge script script/DeployKingdom.s.sol:DeployKingdom --via-ir \
            --rpc-url $RPC_URL \
            --private-key $PRIVATE_KEY \
            --broadcast --slow
