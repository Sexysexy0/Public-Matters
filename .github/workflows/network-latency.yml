permissions:
  contents: read
name: Network Latency Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  network-latency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run latency checks
        run: node scripts/network-latency.js
      - name: Upload latency logs
        uses: actions/upload-artifact@v3
        with:
          name: latency-logs
          path: logs
