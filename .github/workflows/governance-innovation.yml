permissions:
  contents: read
name: Governance Innovation Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Daily at 3 AM UTC

jobs:
  governance-innovation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run innovation pipeline
        run: node scripts/governance-innovation.js
      - name: Upload innovation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-innovation
          path: artifacts
