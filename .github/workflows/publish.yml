permissions:
  contents: read
name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ./out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
