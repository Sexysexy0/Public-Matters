permissions:
  contents: read
name: Governance Audit

on:
  schedule:
    - cron: '0 2 * * SUN' # Weekly every Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run governance audit
        run: node scripts/governance-audit.js
      - name: Upload audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-audit-report
          path: reports
