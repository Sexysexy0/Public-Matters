permissions:
  contents: read
name: Governance Audit

on:
  schedule:
    - cron: '0 2 * * SUN' # Weekly every Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  governance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run governance audit
        run: node scripts/governance-audit.js
      - name: Upload audit report
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-audit-report
          path: reports
