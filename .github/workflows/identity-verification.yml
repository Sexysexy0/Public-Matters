name: Identity Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  identity-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run identity verification checks
        run: node scripts/identity-verification.js
      - name: Upload verification logs
        uses: actions/upload-artifact@v3
        with:
          name: identity-verification-logs
          path: logs
