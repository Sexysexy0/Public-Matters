name: Weekly Matrix Workflow Tests

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2 AM UTC
  workflow_dispatch:

jobs:
  weekly-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow: [
          "identity-verification.js",
          "stress-tests.js",
          "governance-audit.js",
          "network-latency.js",
          "incident-response.js",
          "risk-assessment.js",
          "governance-compliance.js",
          "governance-dashboard.js",
          "governance-forecast.js",
          "governance-performance.js"
        ]
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - name: Run weekly workflow script
        run: node scripts/${{ matrix.workflow }}
