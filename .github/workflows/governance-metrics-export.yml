permissions:
  contents: read
name: Governance Metrics Export

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

jobs:
  governance-metrics-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Export governance metrics
        run: node scripts/governance-metrics-export.js
      - name: Upload metrics export
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-metrics
          path: metrics
