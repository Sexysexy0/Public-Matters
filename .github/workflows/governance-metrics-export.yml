permissions:
  contents: read
name: Governance Metrics Export

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

jobs:
  governance-metrics-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Export governance metrics
        run: node scripts/governance-metrics-export.js
      - name: Upload metrics export
        uses: actions/upload-artifact@v3
        with:
          name: governance-metrics
          path: metrics
