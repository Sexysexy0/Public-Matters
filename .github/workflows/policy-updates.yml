permissions:
  contents: read
name: Policy Updates Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # Daily at 4 PM UTC

jobs:
  policy-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: npm install
      - name: Apply policy updates
        run: node scripts/policy-updates.js
      - name: Upload update logs
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: policy-updates
          path: logs
