permissions:
  contents: read
name: Policy Updates Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # Daily at 4 PM UTC

jobs:
  policy-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Apply policy updates
        run: node scripts/policy-updates.js
      - name: Upload update logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-updates
          path: logs
