permissions:
  contents: read
name: Cleanup Artifacts

on:
  schedule:
    - cron: "0 2 * * 0" # run weekly, Sunday 2 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old artifacts
        uses: geekyeggo/delete-artifact@54ab544f12cdb7b71613a16a2b5a37a9ade990af # v2
        with:
          age: 7 # delete artifacts older than 7 days
          skip-recent: 3 # keep last 3 artifacts
