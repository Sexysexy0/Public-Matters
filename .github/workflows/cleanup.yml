permissions:
  contents: read
name: Cleanup Artifacts

on:
  schedule:
    - cron: "0 2 * * 0" # run weekly, Sunday 2 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          age: 7 # delete artifacts older than 7 days
          skip-recent: 3 # keep last 3 artifacts
