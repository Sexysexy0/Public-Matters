permissions:
  contents: read
name: Governance Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes

jobs:
  governance-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Run governance alerts
        run: node scripts/governance-alerts.js
      - name: Upload alert logs
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-alerts
          path: alerts
