permissions:
  contents: read
name: Docker Build

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5cad5145e754f809f0d95d466649c50e1f72131 # v4

      - name: Login to DockerHub
        uses: docker/login-action@9780b0c442fdb111702fae045f1ccf5fb743cfb1 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@af608e5896a7042079c5c2428612f00a582315a6 # v7
        with:
          context: .
          push: true
          tags: sexysexy0/public-matters:${{ github.ref_name }}
