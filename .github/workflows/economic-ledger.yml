permissions:
  contents: read
name: Economic Ledger Tracking

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM UTC

jobs:
  economic-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run economic ledger tracking
        run: node scripts/economic-ledger.js
      - name: Upload ledger artifacts
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: economic-ledger
          path: ledger
