permissions:
  contents: read
name: Regression Guard

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c30f40d6e679b375b066d92976b9f2d184fc3a0b # v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install || true
          forge update || true

      - name: Run gas snapshot
        run: forge snapshot --snap gas-snapshot.txt

      - name: Compare with baseline
        run: |
          forge snapshot --diff gas-snapshot.txt --snap gas-snapshot-baseline.txt --threshold 5
