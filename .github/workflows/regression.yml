permissions:
  contents: read
name: Regression Guard

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install || true
          forge update || true

      - name: Run gas snapshot
        run: forge snapshot --snap gas-snapshot.txt

      - name: Compare with baseline
        run: |
          forge snapshot --diff gas-snapshot.txt --snap gas-snapshot-baseline.txt --threshold 5
