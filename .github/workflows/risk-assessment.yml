permissions:
  contents: read
name: Risk Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Daily at 12 PM UTC

jobs:
  risk-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Run risk assessment
        run: node scripts/risk-assessment.js
      - name: Upload risk reports
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: risk-reports
          path: reports
