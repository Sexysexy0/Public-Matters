permissions:
  contents: read
name: Risk Assessment

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Daily at 12 PM UTC

jobs:
  risk-assessment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run risk assessment
        run: node scripts/risk-assessment.js
      - name: Upload risk reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: risk-reports
          path: reports
