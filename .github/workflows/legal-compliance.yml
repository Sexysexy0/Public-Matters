permissions:
  contents: read
name: Legal Compliance Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *' # Daily at 7 AM UTC

jobs:
  legal-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Run legal compliance checks
        run: node scripts/legal-compliance.js
      - name: Upload compliance reports
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: compliance-reports
          path: reports
