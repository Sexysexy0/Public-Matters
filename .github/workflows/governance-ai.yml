permissions:
  contents: read
name: Governance AI Assistance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # Daily at 5 PM UTC

jobs:
  governance-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run AI-assisted governance checks
        run: node scripts/governance-ai.js
      - name: Upload AI governance reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-ai
          path: reports
