permissions:
  contents: read
name: Governance AI Assistance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # Daily at 5 PM UTC

jobs:
  governance-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: npm install
      - name: Run AI-assisted governance checks
        run: node scripts/governance-ai.js
      - name: Upload AI governance reports
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-ai
          path: reports
