permissions:
  contents: read
name: Governance Risk Mapping
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
jobs:
  governance-risk-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm install
      - run: node scripts/governance-risk-mapping.js
