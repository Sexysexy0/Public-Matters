permissions:
  contents: read
name: Verify Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: latest

      - name: Run tests
        run: forge test -vv

      - name: Run coverage
        run: forge coverage --ir-minimum --report lcov

      - name: Run lint
        run: forge fmt --check

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither analysis
        run: slither ./src --ignore-compile --exclude solc-version

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: ./out
