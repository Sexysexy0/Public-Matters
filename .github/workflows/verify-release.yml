permissions:
  contents: read
name: Verify Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --force

      - name: Setup Foundry
        uses: ethereum/setup-foundry@v1
        with:
          version: latest

      - name: Run tests
        run: forge test -vv

      - name: Run coverage
        run: forge coverage --report lcov

      - name: Run lint
        run: |
          forge fmt --check
          npx eslint . --ext .js,.ts --max-warnings=0

      - name: Run Slither analysis
        run: slither ./contracts --ignore-compile --exclude solc-version

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification
          path: ./out
