permissions:
  contents: read
name: Verify Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c30f40d6e679b375b066d92976b9f2d184fc3a0b # v1
        with:
          version: latest

      - name: Run tests
        run: forge test -vv

      - name: Run coverage
        run: forge coverage --ir-minimum --report lcov

      - name: Run lint
        run: forge fmt --check

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither analysis
        run: slither ./src --ignore-compile --exclude solc-version

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@ea73c09b6fa754f92330a905a96860840b2b8004 # v7
        with:
          name: release-verification
          path: ./out
