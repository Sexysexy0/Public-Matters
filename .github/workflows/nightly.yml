permissions:
  contents: read
name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7
        with:
          submodules: recursive

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: latest

      - name: Run full test suite
        run: forge test -vv

      - name: Run coverage
        run: forge coverage --ir-minimum --report lcov

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither analysis
        run: slither ./src --ignore-compile --exclude solc-version

      - name: Upload nightly artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-report
          path: ./out
