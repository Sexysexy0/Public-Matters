name: Lint

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --force

      - name: Setup Foundry
        uses: ethereum/setup-foundry@v1
        with:
          version: latest

      - name: Run Forge formatter
        run: forge fmt --check

      - name: Run ESLint
        run: npx eslint . --ext .js,.ts --max-warnings=0
