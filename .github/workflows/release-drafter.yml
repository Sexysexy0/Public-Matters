name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Idagdag ang permissions block na ito upang bigyan ang GITHUB_TOKEN ng karapatang mag-edit at gumawa ng draft releases
permissions:
  contents: write
  pull-requests: read
  id-token: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
