permissions:
  contents: read
name: Governance Forecasting

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  governance-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: npm install
      - name: Run governance forecasting
        run: node scripts/governance-forecast.js
      - name: Upload forecast reports
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-forecast
          path: forecasts
