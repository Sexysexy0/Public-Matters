permissions:
  contents: read
name: Governance Forecasting

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  governance-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run governance forecasting
        run: node scripts/governance-forecast.js
      - name: Upload forecast reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-forecast
          path: forecasts
