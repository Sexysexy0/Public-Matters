permissions:
  contents: read
name: Governance Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # Daily at 9 PM UTC

jobs:
  governance-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Run governance analytics
        run: node scripts/governance-analytics.js
      - name: Upload analytics dashboards
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-analytics
          path: dashboards
