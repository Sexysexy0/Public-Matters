name: Governance Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # Daily at 9 PM UTC

jobs:
  governance-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run governance analytics
        run: node scripts/governance-analytics.js
      - name: Upload analytics dashboards
        uses: actions/upload-artifact@v3
        with:
          name: governance-analytics
          path: dashboards
