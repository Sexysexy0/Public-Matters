permissions:
  contents: read
name: Governance Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # Daily at 9 PM UTC

jobs:
  governance-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: npm install
      - name: Run governance analytics
        run: node scripts/governance-analytics.js
      - name: Upload analytics dashboards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governance-analytics
          path: dashboards
