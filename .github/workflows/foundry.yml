name: Foundry CI + Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        submodules: recursive
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@c30f40d6e679b375b066d92976b9f2d184fc3a0b # v1
      with:
        version: latest
    - name: Build contracts
      run: forge build
    - name: Run tests
      run: forge test -vvv
