permissions:
  contents: read
name: Governance Integrity Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # Daily at 10 PM UTC

jobs:
  governance-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Install dependencies
        run: npm install
      - name: Run integrity checks
        run: node scripts/governance-integrity.js
      - name: Upload integrity reports
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-integrity
          path: reports
