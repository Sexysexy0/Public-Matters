permissions:
  contents: read
name: Ethics Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # Daily at 7 PM UTC

jobs:
  ethics-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install dependencies
        run: npm install
      - name: Run ethics audit
        run: node scripts/ethics-audit.js
      - name: Upload ethics audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ethics-audit
          path: reports
