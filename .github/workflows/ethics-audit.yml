name: Ethics Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # Daily at 7 PM UTC

jobs:
  ethics-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run ethics audit
        run: node scripts/ethics-audit.js
      - name: Upload ethics audit reports
        uses: actions/upload-artifact@v3
        with:
          name: ethics-audit
          path: reports
