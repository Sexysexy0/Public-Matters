permissions:
  contents: read
name: Benchmarks

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7
        with:
          submodules: recursive
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@c30f40d6e679b375b066d92976b9f2d184fc3a0b # v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install || true
          forge update || true

      - name: Run benchmarks
        run: forge test --gas-report -vv

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea73c09b6fa754f92330a905a96860840b2b8004 # v7
        with:
          name: benchmark-report
          path: ./gas-report.txt
