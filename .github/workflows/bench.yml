permissions:
  contents: read
name: Benchmarks

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install || true
          forge update || true

      - name: Run benchmarks
        run: forge test --gas-report -vv

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-report
          path: ./gas-report.txt
