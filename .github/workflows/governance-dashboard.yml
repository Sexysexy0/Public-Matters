permissions:
  contents: read
name: Governance Dashboard Export

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # Daily at 11 AM UTC

jobs:
  governance-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Install dependencies
        run: npm install
      - name: Generate governance dashboard
        run: node scripts/governance-dashboard.js
      - name: Upload dashboard export
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: governance-dashboard
          path: dashboard
