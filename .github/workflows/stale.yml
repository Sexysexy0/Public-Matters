name: Close Stale Issues

on:
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. If you believe this is still relevant, please
            comment or remove the stale label. Otherwise, it will be closed in 7 days.
          stale-pr-message: >
            This pull request has been automatically marked as stale due to inactivity.
            Please update or comment to keep it open. It will be closed in 7 days if no activity occurs.
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "security,critical"
          exempt-pr-labels: "work-in-progress"
