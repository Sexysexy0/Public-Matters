permissions:
  contents: read
name: Publish Artifacts

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7
        with:
          submodules: recursive
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: latest

      - name: Install dependencies
        run: |
          forge install || true
          forge update || true

      - name: Run tests
        run: forge test -vv

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@ea73c09b6fa754f92330a905a96860840b2b8004 # v7
        with:
          name: build-artifacts
          path: ./out

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea73c09b6fa754f92330a905a96860840b2b8004 # v7
        with:
          name: test-logs
          path: ./out/test-logs || .

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@ea73c09b6fa754f92330a905a96860840b2b8004 # v7
        with:
          name: gas-report
          path: ./gas-report.txt
