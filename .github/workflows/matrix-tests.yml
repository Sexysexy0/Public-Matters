name: Matrix Workflow Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  matrix-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow: [
          "identity-verification.js",
          "stress-tests.js",
          "governance-audit.js",
          "network-latency.js",
          "incident-response.js",
          "risk-assessment.js"
        ]
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - name: Run workflow script
        run: node scripts/${{ matrix.workflow }}
