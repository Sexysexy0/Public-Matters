name: Auto-Update Badges

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6 AM UTC
  workflow_dispatch:

# Default to read-only; the badge job explicitly needs contents: write.
permissions:
  contents: read
jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
      - name: Refresh README badges
        run: |
          sed -i '/## CI\/CD Status/,$!d' README.md
          echo "![Nightly Matrix](https://github.com/Sexysexy0/Public-Matters/actions/workflows/nightly-matrix.yml/badge.svg)" >> README.md
          echo "![Weekly Matrix](https://github.com/Sexysexy0/Public-Matters/actions/workflows/weekly-matrix.yml/badge.svg)" >> README.md
          echo "![Monthly Matrix](https://github.com/Sexysexy0/Public-Matters/actions/workflows/monthly-matrix.yml/badge.svg)" >> README.md
          echo "![Quarterly Matrix](https://github.com/Sexysexy0/Public-Matters/actions/workflows/quarterly-matrix.yml/badge.svg)" >> README.md
          echo "![Yearly Matrix](https://github.com/Sexysexy0/Public-Matters/actions/workflows/yearly-matrix.yml/badge.svg)" >> README.md
      - name: Commit and push
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"
          git add README.md
          git commit -m "Auto-update CI/CD badges"
          git push origin main
