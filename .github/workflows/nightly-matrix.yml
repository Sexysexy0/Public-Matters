name: Nightly Matrix Workflow Tests

on:
  schedule:
    - cron: '0 23 * * *' # Every day at 11 PM UTC
  workflow_dispatch:

jobs:
  nightly-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow: [
          "identity-verification.js",
          "stress-tests.js",
          "governance-audit.js",
          "network-latency.js",
          "incident-response.js",
          "risk-assessment.js",
          "governance-compliance.js",
          "governance-dashboard.js"
        ]
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - name: Run nightly workflow script
        run: node scripts/${{ matrix.workflow }}
