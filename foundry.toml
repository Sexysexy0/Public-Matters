[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
via-ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${ETH_MAINNET_RPC}"
sepolia = "${ETH_SEPOLIA_RPC}"
base = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
optimism = "${OP_MAINNET_RPC}"
op_sepolia = "${OP_SEPOLIA_RPC}"
arbitrum = "${ARB_MAINNET_RPC}"
arb_sepolia = "${ARB_SEPOLIA_RPC}"
polygon = "${POLYGON_MAINNET_RPC}"
amoy = "${POLYGON_AMOY_RPC}"
zksync = "${ZK_MAINNET_RPC}"
zksync_sepolia = "${ZK_SEPOLIA_RPC}"
linea = "${LINEA_MAINNET_RPC}"
linea_sepolia = "${LINEA_SEPOLIA_RPC}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }
optimism = { key = "${OPTIMISM_API_KEY}" }
op_sepolia = { key = "${OPTIMISM_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
arb_sepolia = { key = "${ARBISCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
amoy = { key = "${POLYGONSCAN_API_KEY}" }

[
  "modifier-used-only-once",
  "internal-function-used-once",
  "custom-errors",
  "asm-keccak256",
  "missing-zero-check",
  "reentrancy-events",
  "weak-prng",
  "missing-events-access-control",
  "block-timestamp",
  "unsafe-typecast",
  "require-revert-in-loop",
  "arbitrary-send-eth",
  "encode-packed-collision",
  "uninitialized-state",
  "calls-loop",
  "unused-return",
  "uninitialized-local",
  "locked-ether",
  "environment-read-across-mutation"
]

[
    "block-timestamp",
    "unsafe-typecast",
    "environment-read-across-mutation",
    "require-revert-in-loop",
    "weak-prng",
]

[lint]
# ──── Styles and false positives — safe to silence ─────────────
ignore = [
  "modifier-used-only-once",
  "internal-function-used-once",
  "custom-errors",
  "asm-keccak256",
  "weak-prng",                       # record IDs, not randomness
  "block-timestamp",                 # window checks, not lottery draws
  "unsafe-typecast",                 # uint64(block.timestamp) safe until year 584B
  "require-revert-in-loop",          # fail-fast is intentional
  "calls-loop",                      # gas hint, not a safety issue
  "environment-read-across-mutation" # test-only concern
]

# ──── Security-relevant rules — DO NOT silence here ────────────
# If one fires, fix the code OR disable it per-line with a rationale
# comment. Never remove from this list globally.
#
#   encode-packed-collision         real hash collision risk
#   missing-zero-check              real bug class
#   missing-events-access-control   real transparency gap
#   reentrancy-events               real ordering hazard
#   unused-return                   real silent-failure hazard
#   uninitialized-state             real bug class
#   uninitialized-local             real bug class
#   arbitrary-send-eth              real; per-line disable with rationale
#   locked-ether                    real; per-line disable with rationale
