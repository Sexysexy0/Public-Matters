[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.35"
via-ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
mainnet = "${ETH_MAINNET_RPC}"
sepolia = "${ETH_SEPOLIA_RPC}"
base = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
optimism = "${OP_MAINNET_RPC}"
op_sepolia = "${OP_SEPOLIA_RPC}"
arbitrum = "${ARB_MAINNET_RPC}"
arb_sepolia = "${ARB_SEPOLIA_RPC}"
polygon = "${POLYGON_MAINNET_RPC}"
amoy = "${POLYGON_AMOY_RPC}"
zksync = "${ZK_MAINNET_RPC}"
zksync_sepolia = "${ZK_SEPOLIA_RPC}"
linea = "${LINEA_MAINNET_RPC}"
linea_sepolia = "${LINEA_SEPOLIA_RPC}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }
optimism = { key = "${OPTIMISM_API_KEY}" }
op_sepolia = { key = "${OPTIMISM_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
arb_sepolia = { key = "${ARBISCAN_API_KEY}" }
polygon = { key = "${POLYGONSCAN_API_KEY}" }
amoy = { key = "${POLYGONSCAN_API_KEY}" }

[lint]
# Excluded rules with rationale:
#   missing-events-access-control - the rule fires on any state mutation
#     that isn't paired with an emit on the SAME line. This codebase's
#     style is to emit on the following line, which the rule cannot see.
#     Event coverage is verified by review + the AIDecisionAudit trail
#     rather than by this lint.
#   modifier-used-only-once, internal-function-used-once - style, not safety
#   custom-errors, asm-keccak256, calls-loop - style / gas hints
#   weak-prng, block-timestamp, unsafe-typecast - false positives here
#   require-revert-in-loop - fail-fast is intentional
#   environment-read-across-mutation - test-only concern
#   missing-zero-check - 46 hits, all boilerplate; value transfers
#     are checked at their call sites instead
exclude_lints = [
  "modifier-used-only-once",
  "internal-function-used-once",
  "custom-errors",
  "asm-keccak256",
  "weak-prng",
  "block-timestamp",
  "unsafe-typecast",
  "require-revert-in-loop",
  "calls-loop",
  "environment-read-across-mutation",
  "missing-zero-check",
  "missing-events-access-control"
]

# Security-relevant rules remain enforced. If one fires, fix the code or
# disable per-line with a rationale comment:
#   encode-packed-collision
#   reentrancy-events
#   unused-return
#   uninitialized-state
#   uninitialized-local
#   arbitrary-send-eth
#   locked-ether
